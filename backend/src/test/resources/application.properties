# Tests run against an in-memory H2 database in PostgreSQL mode, so no PostgreSQL server is needed.
spring.datasource.url=jdbc:h2:mem:school_erp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=DAY,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.config.import=

# Tests never call Expo, Razorpay or Twilio. The Razorpay keys are fake so signature checks can be tested.
app.notify.push.enabled=false
app.payments.razorpay.key-id=rzp_test_dummy
app.payments.razorpay.key-secret=test_secret
app.payments.razorpay.webhook-secret=test_webhook_secret
